/* ===== Brand identity, motion and dashboards (added 16 Nov 2026) ===== */
:root{--b-ss:#14284a;--b-pg:#0f766e;--b-pc:#b23a1e;--b-geo:#5b21b6;--b-study:#1d4ed8;--b-on:#ffffff}
:root[data-theme="dark"]{--b-ss:#e6c170;--b-pg:#5eead4;--b-pc:#ff9d7a;--b-geo:#c4b5fd;--b-study:#93c5fd;--b-on:#141a24}

[data-brand]{transition:background-color .45s ease}
[data-brand="ss"]{--hero2:#2b4a7c}
[data-brand="pg"]{--bg:#f0f7f5;--field:#e3efec;--hair:#d6e6e1;--line:#b7d0c9;--accent:#0f766e;--gold:#0f766e;--hero:#0b4f4a;--hero2:#12897f}
[data-brand="pc"]{--bg:#fbf3ea;--field:#f6e8da;--hair:#eeddca;--line:#dcc3aa;--accent:#b23a1e;--gold:#b23a1e;--hero:#7a2413;--hero2:#c2512f}
[data-brand="geo"]{--bg:#f5f2fb;--field:#ebe5f7;--hair:#e0d8f1;--line:#c8bbe3;--accent:#5b21b6;--gold:#5b21b6;--hero:#3b1a86;--hero2:#6d3fd1}
[data-brand="study"]{--bg:#eef4fd;--field:#e1ebfa;--hair:#d3e0f5;--line:#b5c9ea;--accent:#1d4ed8;--gold:#1d4ed8;--hero:#153a8a;--hero2:#2f66e6}
:root[data-theme="dark"] [data-brand="ss"]{--hero2:#2a3a55}
:root[data-theme="dark"] [data-brand="pg"]{--bg:#07110f;--panel:#0e1b19;--field:#152825;--hair:#1c3430;--line:#2b4d47;--accent:#5eead4;--gold:#5eead4;--hero:#0f2e2b;--hero2:#17443f}
:root[data-theme="dark"] [data-brand="pc"]{--bg:#140b08;--panel:#1f1310;--field:#2c1b16;--hair:#38221b;--line:#553429;--accent:#ff9d7a;--gold:#ff9d7a;--hero:#3a1a12;--hero2:#55271a}
:root[data-theme="dark"] [data-brand="geo"]{--bg:#0d0a17;--panel:#171226;--field:#211a36;--hair:#2a2145;--line:#413468;--accent:#c4b5fd;--gold:#c4b5fd;--hero:#241a44;--hero2:#35276a}
:root[data-theme="dark"] [data-brand="study"]{--bg:#080d18;--panel:#101828;--field:#18233a;--hair:#1f2d4a;--line:#30446e;--accent:#93c5fd;--gold:#93c5fd;--hero:#13264d;--hero2:#1c3870}

/* Top bar and brand tabs */
.app-header{border-bottom:3px solid var(--accent);transition:border-color .45s ease,background-color .45s ease}
.brand-nav{padding:.3rem .15rem;scrollbar-width:none}
.brand-nav::-webkit-scrollbar{display:none}
.brand-tab{--tc:var(--b-ss);display:inline-flex;align-items:center;gap:.5rem;flex-shrink:0;padding:.45rem .95rem;border-radius:999px;font-size:.875rem;font-weight:700;color:var(--mute);background:var(--panel);border:1px solid var(--hair);transition:transform .18s ease,box-shadow .18s ease,background-color .25s ease,color .25s ease,border-color .25s ease}
.brand-tab[data-tab="pg"]{--tc:var(--b-pg)}
.brand-tab[data-tab="pc"]{--tc:var(--b-pc)}
.brand-tab[data-tab="geo"]{--tc:var(--b-geo)}
.brand-tab[data-tab="study"]{--tc:var(--b-study)}
.brand-tab::before{content:"";width:.6rem;height:.6rem;border-radius:50%;background:var(--tc);transition:transform .25s ease,background-color .25s ease}
.brand-tab:hover{color:var(--ink);border-color:var(--tc);transform:translateY(-1px)}
.brand-tab[aria-selected="true"]{background:var(--tc);border-color:var(--tc);color:var(--b-on);box-shadow:0 8px 18px -8px var(--tc)}
.brand-tab[aria-selected="true"]::before{background:var(--b-on);transform:scale(1.25)}

/* Brand banner */
.brand-hero{position:relative;overflow:hidden;align-items:center;padding:1.35rem 1.5rem 1.35rem 5.6rem;border-radius:1.25rem;color:var(--onhero);background:linear-gradient(120deg,var(--hero),var(--hero2,var(--hero)));box-shadow:0 18px 40px -22px var(--hero);animation:cc-rise .5s cubic-bezier(.2,.7,.2,1) backwards}
.brand-hero::before{content:attr(data-mono);position:absolute;left:1.2rem;top:50%;margin-top:-1.7rem;width:3.4rem;height:3.4rem;border-radius:1rem;display:grid;place-items:center;font-weight:800;font-size:.9rem;letter-spacing:.02em;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.32);animation:cc-pop .6s .1s backwards}
.brand-hero::after{content:"";position:absolute;right:-4rem;top:-6rem;width:16rem;height:16rem;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.2),rgba(255,255,255,0) 70%);animation:cc-float 9s ease-in-out infinite;pointer-events:none}
.brand-hero h1{color:inherit}
.brand-hero p{color:inherit;opacity:.85}
.brand-hero>*{position:relative;z-index:1}
.brand-hero button{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.38);color:inherit}
.brand-hero button:hover{background:rgba(255,255,255,.24);border-color:rgba(255,255,255,.7)}

/* Dashboards strip */
.dash-bar{margin-bottom:1.5rem;animation:cc-rise .5s .06s cubic-bezier(.2,.7,.2,1) backwards}
.dash-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:.5rem;margin-bottom:.6rem}
.dash-title{font-size:.75rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.dash-grid{display:grid;gap:.75rem;grid-template-columns:repeat(auto-fit,minmax(15rem,1fr))}
.dash-tile{display:flex;align-items:center;gap:.9rem;width:100%;padding:.9rem 1rem;border-radius:1rem;text-align:left;color:var(--ink);background:var(--panel);border:1px solid var(--hair);border-left:4px solid var(--accent);transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease}
.dash-tile:hover{transform:translateY(-2px);border-color:var(--accent);box-shadow:0 14px 28px -18px var(--accent)}
.dash-tile:active{transform:scale(.98)}
.dash-tile.empty{border-style:dashed;border-left-style:solid}
.dash-ico{flex-shrink:0;width:2.6rem;height:2.6rem;border-radius:.8rem;display:grid;place-items:center;font-size:.8rem;font-weight:800;background:var(--accent);color:var(--onaccent)}
.dash-tile.empty .dash-ico{background:var(--field);color:var(--mute)}
.dash-name{display:block;font-size:.95rem;font-weight:700}
.dash-sub{display:block;font-size:.78rem;color:var(--mute)}
.dash-go{margin-left:auto;white-space:nowrap;font-size:.78rem;font-weight:800;color:var(--accent)}
.dash-edit{display:grid;gap:.75rem;margin-top:.75rem;padding:1rem;border-radius:1rem;background:var(--panel);border:1px solid var(--hair);animation:cc-rise .3s backwards}

/* Sections inside a tab */
#screen{counter-reset:cc-sec}
#screen>*{animation:cc-rise .45s cubic-bezier(.2,.7,.2,1) backwards}
section.card{border-top:3px solid var(--accent);animation:cc-rise .5s cubic-bezier(.2,.7,.2,1) backwards;transition:transform .2s ease,box-shadow .2s ease,border-color .45s ease}
section.card:nth-of-type(2){animation-delay:.06s}
section.card:nth-of-type(3){animation-delay:.12s}
section.card:nth-of-type(n+4){animation-delay:.18s}
@media (hover:hover){section.card:hover{transform:translateY(-2px);box-shadow:0 1px 2px rgba(16,21,29,.05),0 22px 44px -22px rgba(16,21,29,.3)}}
section.card>header h2{display:flex;align-items:center;gap:.6rem}
section.card>header h2::before{counter-increment:cc-sec;content:counter(cc-sec);flex-shrink:0;min-width:1.6rem;height:1.6rem;padding:0 .3rem;border-radius:.5rem;display:inline-grid;place-items:center;font-size:.75rem;font-weight:800;background:var(--accent);color:var(--onaccent)}
.sect>h3{display:flex;align-items:center;gap:.5rem;color:var(--accent)}
.sect>h3::before{content:"";width:1rem;height:3px;border-radius:2px;background:var(--accent)}
#screen [role="tablist"]{border:1px solid var(--hair)}
#screen [role="tab"]{transition:background-color .2s ease,color .2s ease,box-shadow .2s ease,transform .15s ease}
#screen [role="tab"][aria-selected="true"]{background:var(--accent);color:var(--onaccent);border-color:var(--accent);box-shadow:0 6px 14px -6px var(--accent)}
.bg-hero{background-image:linear-gradient(135deg,var(--hero),var(--hero2,var(--hero)));transition:background-color .45s ease}
.cc-pop{animation:cc-pop .35s cubic-bezier(.2,.9,.3,1.2)}

/* Reactions */
button{transition:transform .12s ease,box-shadow .18s ease,background-color .18s ease,border-color .18s ease,color .18s ease,opacity .18s ease}
button:active:not(:disabled){transform:scale(.96)}
@media (hover:hover){.bg-accent:hover:not(:disabled){box-shadow:0 10px 20px -10px var(--accent);transform:translateY(-1px)}}
input,select,textarea{transition:border-color .18s ease,box-shadow .18s ease,background-color .18s ease}
input:focus,select:focus,textarea:focus{box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 24%,transparent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#screen tbody tr{transition:background-color .15s ease}
@media (hover:hover){#screen tbody tr:hover{background-color:var(--field)}}
[role="status"],[role="alert"]{animation:cc-rise .3s ease backwards}
[role="dialog"]{animation:cc-modal .25s cubic-bezier(.2,.7,.2,1) backwards}

@keyframes cc-rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes cc-pop{0%{opacity:.4;transform:scale(.9)}60%{transform:scale(1.05)}100%{opacity:1;transform:none}}
@keyframes cc-modal{from{opacity:0;transform:translateY(18px) scale(.97)}to{opacity:1;transform:none}}
@keyframes cc-float{0%,100%{transform:translate(0,0)}50%{transform:translate(-1.5rem,1.2rem)}}
@media (max-width:480px){.brand-hero{padding-left:4.6rem}.brand-hero::before{left:.8rem;width:3rem;height:3rem;margin-top:-1.5rem;font-size:.78rem}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* ===== public build: login, sync badge, phone safe areas ===== */
.cc-login{min-height:100vh;display:grid;place-items:center;padding:1.25rem;background:var(--bg)}
.cc-login-card{width:100%;max-width:26rem;display:grid;gap:1rem;padding:2rem 1.75rem;border-radius:1.25rem;background:var(--panel);border:1px solid var(--hair);border-top:4px solid var(--accent);box-shadow:0 24px 50px -28px rgba(20,40,74,.45);animation:cc-rise .5s cubic-bezier(.2,.7,.2,1) backwards}
.cc-login-logo{width:3.4rem;height:3.4rem;border-radius:1rem;display:grid;place-items:center;font-weight:800;background:var(--hero);color:var(--onhero)}
.cc-badge{display:inline-flex;align-items:center;gap:.4rem;font-size:.75rem;font-weight:700;color:var(--mute)}
.cc-dot{width:.55rem;height:.55rem;border-radius:50%;background:var(--mute)}
.cc-badge[data-s="saved"] .cc-dot{background:var(--good)}
.cc-badge[data-s="saving"] .cc-dot{background:var(--gold);animation:cc-pulse 1s ease-in-out infinite}
.cc-badge[data-s="offline"] .cc-dot,.cc-badge[data-s="expired"] .cc-dot{background:var(--bad)}
@media (max-width:640px){.cc-badge[data-s="saved"] .cc-badge-t,.cc-badge[data-s="idle"] .cc-badge-t{display:none}.cc-badge-t{max-width:7.5rem;line-height:1.1}}
@keyframes cc-pulse{50%{opacity:.3}}
body{padding-bottom:env(safe-area-inset-bottom)}
.app-header{padding-top:env(safe-area-inset-top)}
